version: '3.8'

services:
  qemu1:
    image: ubuntu:22.04
    container_name: qemu1-alpine
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./nocloud_alpine-3.20.2-x86_64-bios-cloudinit-r0-1.qcow2:/root/alpine.qcow2:rw
      - ./cloud-init.iso:/root/cloud-init.iso:ro
      - ./start-qemu.sh:/usr/local/bin/start-qemu.sh:ro
      - ./generate-dhcpd-conf.sh:/run/generate-dhcpd-conf.sh:ro
      - ../target:/target
    environment:
      - QEMU_IP=192.168.10.10
      - QEMU_MAC=52:54:00:12:34:56
    networks:
      eth0_outside:
        ipv4_address: 192.168.10.10
      eth1_inside:
        ipv4_address: 10.10.0.10
    command: /usr/local/bin/start-qemu.sh
    ports:
      - "5901:5900"

  qemu2:
    image: ubuntu:22.04
    container_name: qemu2-alpine
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./nocloud_alpine-3.20.2-x86_64-bios-cloudinit-r0-2.qcow2:/root/alpine.qcow2:rw
      - ./cloud-init.iso:/root/cloud-init.iso:ro
      - ./start-qemu.sh:/usr/local/bin/start-qemu.sh:ro
      - ./generate-dhcpd-conf.sh:/run/generate-dhcpd-conf.sh:ro
      - ../target:/target
    environment:
      - QEMU_IP=192.168.10.11
      - QEMU_MAC=52:54:00:12:34:57
    networks:
      eth0_outside:
        ipv4_address: 192.168.10.11
      eth1_inside:
        ipv4_address: 10.10.0.11
    command: /usr/local/bin/start-qemu.sh
    ports:
      - "5902:5900"
networks:
  eth0_outside:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  eth1_inside:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24